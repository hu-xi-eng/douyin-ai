<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no, email=no, address=no">
    <meta name="full-screen" content="yes">
    <meta name="screen-orientation" content="portrait">
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>声迹 - 听音识物大挑战</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="stage" id="stage">
        <div class="game-page" id="gamePage">

            <!-- 1. 标题区 -->
            <header class="section section-title" id="sectionTitle">
                <div class="title-wrap">
                    <span class="title-note title-note-l" aria-hidden="true">♪</span>
                    <span class="title-note title-note-r" aria-hidden="true">♫</span>
                    <h1 class="title-main">听音识物大挑战</h1>
                </div>
                <div class="title-sub">
                    <span class="title-sub-text">这一局你听见了什么</span>
                </div>
            </header>

            <!-- 2. 数据展示卡片：得分 / 还原程度 / 声音鉴定水平 -->
            <section class="section section-info" id="sectionInfo">
                <div class="info-card">

                    <!-- 本轮得分 -->
                    <div class="info-row info-row-score">
                        <div class="info-label">本轮得分</div>
                        <div class="score-value">
                            <span class="score-number" id="scoreNumber">0</span>
                            <span class="score-unit">分</span>
                        </div>
                        <div class="score-stars" id="scoreStars" aria-hidden="true">
                            <span class="star"></span>
                            <span class="star"></span>
                            <span class="star"></span>
                            <span class="star"></span>
                            <span class="star"></span>
                        </div>
                    </div>

                    <div class="info-divider"></div>

                    <!-- 还原程度 -->
                    <div class="info-row info-row-similarity">
                        <div class="info-row-head">
                            <span class="info-label">还原程度</span>
                            <span class="info-percent" id="similarityPercent">0%</span>
                        </div>
                        <div class="score-bar">
                            <div class="score-bar-fill" id="similarityBarFill"></div>
                        </div>
                    </div>

                    <div class="info-divider"></div>

                    <!-- 声音鉴定水平 -->
                    <div class="info-row info-row-rank">
                        <div class="info-label">声音鉴定水平</div>
                        <div class="rank-tag" id="rankTag">
                            <span class="rank-icon" aria-hidden="true">🎯</span>
                            <span class="rank-name">听觉猎手</span>
                            <span class="rank-meta">全服前 5%</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- 3. 治愈系便签 -->
            <section class="section section-tip" id="sectionTip">
                <div class="tip-note">
                    <span class="tip-tape" aria-hidden="true"></span>
                    <span class="tip-corner tip-corner-tl" aria-hidden="true">🍊</span>
                    <span class="tip-corner tip-corner-tr" aria-hidden="true">⭐</span>
                    <span class="tip-corner tip-corner-bl" aria-hidden="true">☁️</span>
                    <span class="tip-corner tip-corner-br" aria-hidden="true">🌼</span>
                    <p class="tip-text" id="tipText">感受活着的日子</p>
                </div>
            </section>

            <!-- 4. 底部按钮区 -->
            <footer class="section section-actions" id="sectionActions">
                <button class="btn btn-secondary" id="btnHome" type="button">
                    <span class="btn-icon" aria-hidden="true">🏠</span>
                    <span class="btn-text">返回首页</span>
                </button>
                <button class="btn btn-primary" id="btnRetry" type="button">
                    <span class="btn-icon" aria-hidden="true">🔄</span>
                    <span class="btn-text">再来一局</span>
                </button>
            </footer>

        </div>
    </div>

    <script src="js/canvas.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
