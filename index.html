<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no, email=no, address=no">
    <meta name="full-screen" content="yes">
    <meta name="screen-orientation" content="portrait">
    <meta name="x5-orientation" content="portrait">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>声迹 - 听音识物大挑战</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="stage" id="stage">
        <div class="game-page" id="gamePage">

            <!-- 1. 标题区 -->
            <header class="section section-title" id="sectionTitle">
                <div class="title-wrap">
                    <span class="title-note title-note-l" aria-hidden="true">♪</span>
                    <span class="title-note title-note-r" aria-hidden="true">♫</span>
                    <h1 class="title-main">听音识物大挑战</h1>
                </div>
                <div class="title-sub">
                    <span class="title-sub-text">这一局你听见了什么</span>
                </div>
            </header>

            <!-- 2. 单 Canvas 复刻厨房 -->
            <section class="section section-canvas" id="sectionCanvas">
                <div class="canvas-label-wrap">
                    <span class="canvas-label">我的复刻厨房</span>
                </div>
                <div class="canvas-wrap canvas-wrap-solo">
                    <canvas id="canvasPlayer"></canvas>
                </div>
            </section>

            <!-- 3. 得分展示区 -->
            <section class="section section-score" id="sectionScore">
                <div class="score-label">本轮得分</div>
                <div class="score-value">
                    <span class="score-number" id="scoreNumber">0</span>
                    <span class="score-unit">分</span>
                </div>
                <div class="score-stars" id="scoreStars" aria-hidden="true">
                    <span class="star"></span>
                    <span class="star"></span>
                    <span class="star"></span>
                    <span class="star"></span>
                    <span class="star"></span>
                </div>
                <div class="score-bar">
                    <div class="score-bar-fill" id="scoreBarFill"></div>
                </div>
            </section>

            <!-- 4. 称号标签区 -->
            <section class="section section-medal" id="sectionMedal">
                <span class="medal-tag" id="medalTag">
                    <span class="medal-icon" aria-hidden="true">👨‍🍳</span>
                    <span class="medal-text">颠勺小能手</span>
                </span>
            </section>

            <!-- 5. 选中物品列表区 -->
            <section class="section section-items" id="sectionItems">
                <div class="items-head">
                    <span class="items-title">本轮选中物品</span>
                    <span class="items-count" id="itemsCount">共 0 件</span>
                </div>
                <div class="items-scroll">
                    <ul class="items-list" id="itemsList">
                        <!-- 物品由 JS 渲染 -->
                    </ul>
                </div>
            </section>

            <!-- 6. 趣味提示语区 -->
            <section class="section section-tip" id="sectionTip">
                <div class="tip-note">
                    <span class="tip-tape" aria-hidden="true"></span>
                    <p class="tip-text" id="tipText">独处时我才能听见自己的声音</p>
                </div>
            </section>

            <!-- 7. 底部按钮区 -->
            <footer class="section section-actions" id="sectionActions">
                <button class="btn btn-secondary" id="btnHome" type="button">
                    <span class="btn-icon" aria-hidden="true">🏠</span>
                    <span class="btn-text">返回首页</span>
                </button>
                <button class="btn btn-primary" id="btnRetry" type="button">
                    <span class="btn-icon" aria-hidden="true">🔄</span>
                    <span class="btn-text">再来一局</span>
                </button>
            </footer>

        </div>
    </div>

    <script src="js/canvas.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
